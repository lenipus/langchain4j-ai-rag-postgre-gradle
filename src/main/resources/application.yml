server:
  port: ${SERVER_PORT:8081}
  
spring:
  application:
    name: langchain4j-ai-rag-postgre

  # .env(프로젝트 루트, git에는 안 올라감 - .gitignore 참고)에 있는 값을 환경변수처럼 읽어온다.
  config:
    import: optional:file:.env[.properties]

  # 채팅 서버(langchain4j.ollama.*)/RAG 튜닝처럼 환경마다 값이 다른 설정은 application-{profile}.yml로 분리했다.
  # SPRING_PROFILES_ACTIVE 환경변수로 전환
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

  # PostgreSQL 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:35432}/ragdb
    username: ${POSTGRES_USER:tester}
    password: ${POSTGRES_PASSWORD:test123#}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # session_factory:
        #  statement_inspector: com.example.chatbot.chat.config.DynamicTableInspector
    show-sql: false

  # 빈 오버라이딩 허용
  main:
    allow-bean-definition-overriding: true

# LangChain4j 설정 - "무슨 용도(chat/embedding)"가 최상위, 그 안에서 "어느 백엔드(ollama/openai)"를 고른다.
langchain4j:
  chat:
    ollama:
      base-url: ${OLLAMA_CHAT_BASE_URL:http://localhost:31434}
      api-key: ${OLLAMA_CHAT_API_KEY:}
      api-type: ${OLLAMA_CHAT_API_TYPE:ollama}        # API 규격: (ollama, openai)
      model-name: ${OLLAMA_CHAT_MODEL_NAME:}
      temperature: 0.2
      timeout: 300s
      num-ctx: ${OLLAMA_CHAT_NUM_CTX:8192}
    # ChatGPT 연결
    openai:
      enabled: ${OPENAI_CHAT_ENABLED:false}
      api-key: ${OPENAI_CHAT_API_KEY:}
      model-name: ${OPENAI_CHAT_MODEL_NAME:gpt-4o}
      temperature: 0.2
      timeout: 300s

  embedding:
    ollama:
      base-url: ${OLLAMA_EMBEDDING_BASE_URL:http://localhost:31434}
      api-key: ${OLLAMA_EMBEDDING_API_KEY:}
      api-type: ${OLLAMA_EMBEDDING_API_TYPE:ollama}   # API 규격: (ollama, openai)
      model-name: qllama/bge-m3:q8_0

# PGVector 설정
pgvector:
  table-name: document_embeddings
  dimension: 1024
  create-table: true
  distance-type: cosine   # 거리 측정 방식: (cosine, euclidean, inner_product)
  hash-table-name: document_hashes

document:
  allowed-upload-extensions: .md,.pdf,.docx,.hwp,.hwpx,.txt,.json,.csv,.xls,.xlsx
  upload-dir: ${DOCUMENT_UPLOAD_PATH:/app/rag/upload}/data
  chunk-size: 2000
  chunk-overlap: 200

  # 재인덱싱 시 파일 단위 동시 처리 개수 (1 ~ 4)
  processing:
    concurrency: 1

  normalization:
    enabled: true
    remove-html-tags: true
    remove-code-blocks: false
    normalize-whitespace: true
    normalize-newlines: true
    clean-special-chars: true

# RAG 설정
rag:
  similarity:
    threshold: 0.50   # 유사도 임계값 (0.0 ~ 1.0)
  top-k: 5

  query-compression:
    enabled: true

  query-normalization:
    enabled: true

  retrieval:
    overfetch-multiplier: 3
    min-chunk-length: 250
    neighbor-expansion-chars: 400

    # 하이브리드 검색(dense 벡터 + lexical pg_trgm, RRF 융합) 설정
    hybrid:
      # lexical(pg_trgm)이 한국어 문법적 어미 패턴까지 매칭해 무관한 문서를 끌어올리는
      # 문제가 gemma/bgem3 두 임베딩 프로필 모두, 가중치를 낮춰도 반복 확인돼 껐다.
      enabled: false
      weight:
        dense: 1.0
        lexical: 0.2
      top-k: 3
      lexical:
        word-similarity-threshold: 0.10

  # RAG 검색 감사 로그(rag_retrieval_logs, EgovLoggingContentRetriever가 기록) 관련 설정.
  retrieval-log:
    delete-with-session: true

# 채팅 메모리 설정
chat:
  memory:
    max-messages: 20
    table-name: chat_memory
  image-attachment:
    enabled: false

# 세션 관리 설정
session:
  table-name: chat_sessions

# SQL 생성 도구(com.example.chatbot.sqlgen) 설정
sqlgen:
  enabled: ${SQLGEN_FEATURE_ENABLED:false}
  encryption:
    secret-key: ${SQLGEN_ENCRYPTION_KEY:}

# 로깅 설정
logging:
  level:
    com.example.chatbot.chat: DEBUG
    dev.langchain4j: INFO
    ai.djl: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
